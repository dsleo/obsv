<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Radar data flow</title>
  <desc id="desc">Nemotron rows receive closed tags, official commune context and a survey-based 2022 vote prior. An event is mapped to valid group filters and directional scenario hypotheses.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ad6544"/></marker></defs>
  <rect width="1200" height="390" rx="16" fill="#f4f0e9"/>
  <text x="36" y="48" fill="#282420" font-family="Arial,sans-serif" font-size="21" font-weight="700">FROM SYNTHETIC ROW TO TESTABLE HYPOTHESIS</text>
  <text x="36" y="73" fill="#685e56" font-family="Arial,sans-serif" font-size="13">All quantitative election inputs retain their source and scope.</text>
  <g font-family="Arial,sans-serif">
    <rect x="36" y="116" width="190" height="96" rx="7" fill="#27221f"/><text x="52" y="151" fill="#fff9f1" font-size="18" font-weight="700">Nemotron row</text><text x="52" y="176" fill="#d4c8bb" font-size="12">Synthetic person</text><text x="52" y="194" fill="#d4c8bb" font-size="12">with recorded fields</text>
    <rect x="289" y="116" width="224" height="96" rx="7" fill="#fffaf3" stroke="#c8b9a8"/><text x="305" y="151" fill="#302720" font-size="18" font-weight="700">Closed tags + COG</text><text x="305" y="176" fill="#685e56" font-size="12">Deterministic attributes</text><text x="305" y="194" fill="#685e56" font-size="12">and official commune code</text>
    <rect x="576" y="116" width="243" height="96" rx="7" fill="#fffaf3" stroke="#c8b9a8"/><text x="592" y="151" fill="#302720" font-size="18" font-weight="700">Political context</text><text x="592" y="176" fill="#685e56" font-size="12">Official commune results</text><text x="592" y="194" fill="#685e56" font-size="12">+ modeled 2022 row prior</text>
    <rect x="882" y="116" width="282" height="96" rx="7" fill="#ad6544"/><text x="898" y="151" fill="#fff9f1" font-size="18" font-weight="700">Filterable persona</text><text x="898" y="176" fill="#fff1e7" font-size="12">Source and confidence preserved</text><text x="898" y="194" fill="#fff1e7" font-size="12">for every attribute</text>
    <path d="M228 164 H280" stroke="#ad6544" stroke-width="2" marker-end="url(#arrow)"/><path d="M515 164 H567" stroke="#ad6544" stroke-width="2" marker-end="url(#arrow)"/><path d="M821 164 H873" stroke="#ad6544" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="36" y="267" width="305" height="80" rx="7" fill="#fffaf3" stroke="#c8b9a8"/><text x="52" y="299" fill="#302720" font-size="16" font-weight="700">Dated, sourced event</text><text x="52" y="323" fill="#685e56" font-size="12">Description and comparator</text>
    <rect x="449" y="267" width="298" height="80" rx="7" fill="#fffaf3" stroke="#c8b9a8"/><text x="465" y="299" fill="#302720" font-size="16" font-weight="700">LLM proposes valid IDs</text><text x="465" y="323" fill="#685e56" font-size="12">Code checks and counts groups</text>
    <rect x="855" y="267" width="309" height="80" rx="7" fill="#27221f"/><text x="871" y="299" fill="#fff9f1" font-size="16" font-weight="700">Directional hypotheses</text><text x="871" y="323" fill="#d4c8bb" font-size="12">Group and global scenarios to test</text>
    <path d="M343 307 H440" stroke="#ad6544" stroke-width="2" marker-end="url(#arrow)"/><path d="M749 307 H846" stroke="#ad6544" stroke-width="2" marker-end="url(#arrow)"/><path d="M1023 215 V258" stroke="#ad6544" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>

name: Build and deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily, after refresh-data.yml (05:23 UTC): picks up the latest Sondax polls.
    - cron: "40 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_PUBLIC: ${{ vars.SITE_PUBLIC || 'false' }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_PUBLISHER: ${{ vars.SITE_PUBLISHER }}
      SITE_CONTACT_EMAIL: ${{ vars.SITE_CONTACT_EMAIL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Collect polls (Sondax) and events (API)
        run: npm run data:collect
        env:
          ELECTION_API_KEY: ${{ secrets.ELECTION_API_KEY }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:check-analyses
      - run: npm run build
        env:
          GITHUB_ACTIONS: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Smoke-check exported routes
        run: node scripts/smoke-routes.mjs
      - name: Browser checks
        run: |
          npx playwright install --with-deps chromium webkit firefox
          npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - id: deployment
        uses: actions/deploy-pages@v4
